<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <header class="navbar">
        <!-- Phần logo -->
    <div id="logo">
        <a href="#" class="logo">
            <img src="images/logo.png" alt="logo Web" class="logo-img" width="50px"/>
            <span class="logo-text">First For Future</span>
        </a>
    </div>
    <!-- Phần menu các ngôn ngữ trong web -->
    <div id="menu">
<ul>
    <li><a href="#">HTML</a></li>
    <li><a href="#">CSS</a></li>
    <li><a href="#">BOOTSTRAP</a></li>
    <li><a href="#">JAVASCRIPT</a></li>
    <li><a href="#">C++</a></li>
</ul>
    </div>
   
    <div class="nav-action">
        <a href="https://onecompiler.com/" class="nav-link">Spaces</a>
        <a href="https://leetcode.com/" class="nav-link">Practice</a>
        <a href="#" class="btn-signin">Sign In</a>
      </div>
    </header>
    <section class="hero-section">
        <!-- Phần nội dung tiêu đề chính của trang web, phía bên trái -->
         <div class="hero-content">
                <h1>LEARN TO CODE</h1>
                <p>Chúng tôi sẽ giúp bạn nắm vững kiến thức nền tảng cho các ngôn ngữ lập trình tại trang web</p>
                <div class="hero-button">
                    <a href="#" class="btn-primary">Bắt Đầu Học</a>
                    <a href="#" class="btn-secondary">Liên hệ</a>
                </div>
            </div>
            <!-- Phần ảnh -->
             <div class="hero-img">
                <img src="images/html.jpg" alt="HTML" class="slide active"></a>
                <img src="images/css.jpg" alt="CSS" class="slide">
                <img src="images/jvs.jpg" alt="JAVASCRIPT" class="slide">
                <img src="images/bts.jpg" alt="BOOTSRAP" class="slide">
                <img src="images/cpp.jpg" alt="C++" class="slide">
             </div>
         </div>
    </section>
    <section class="partner">
        <div class="logo">
            <a href="https://github.com/"><img src="images/github.png" alt="logo github"/></a>
            <a href="https://leetcode.com/"><img src="images/leetcode.png" alt="logo leetcode"></a>
            <a href="https://codeforces.com/"><img src="images/codeforce.png" alt="logo codeforce"></a>
            <a href="https://www.hackerrank.com/"><img src="images/hackerank.png" alt="logo hackerrank"></a>
            <a href="https://www.w3schools.com/"><img src="images/w3.png" alt="logo w3bschool"></a>
        </div>
    </section>
    <script>
    const slides = document.querySelectorAll('.hero-img img');
    let currentSlide = 0;
    function nextSlide() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }
    setInterval(nextSlide, 3000);
</script>
</body>
</html>
